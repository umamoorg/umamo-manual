# Builds the manual and publishes it to GitHub Pages, which serves it at
# https://docs.umamo.org/.
#
# Every pull request runs the same strict build as `make check`.  Only a push
# to master, or a manual run on master, deploys.  A build that fails never
# deploys, so the last good version stays online.
name: Manual

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded pull request build, but let a deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the build dependencies
        run: python -m pip install -r requirements.txt

      # Warnings are errors.  Without a .venv, the Makefile uses the
      # sphinx-build that pip just installed.
      - name: Build the manual
        run: make check

      # Dotfiles (.buildinfo, .doctrees) are left out of the upload.
      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
